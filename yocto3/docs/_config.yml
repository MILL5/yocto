title: yocto
tagline: The tiny IoC container for .NET 10
description: >-
  yocto is a tiny, fast, open-source IoC (dependency injection) container for .NET 10 from MILL5. A drop-in
  IServiceProvider for Microsoft.Extensions.DependencyInjection and ASP.NET Core with keyed services, open generics,
  scopes, async disposal, build-time validation, and Native AOT support.
url: https://mill5.github.io
baseurl: /yocto
lang: en-US
logo: /assets/yocto.png
author:
  name: Richard Crane
  url: https://mvp.microsoft.com/en-US/MVP/profile/10ce0bc0-7536-43f6-b28c-e9601a4a0d0d
  title: Microsoft MVP, Founder of MILL5
  email: rich@mill5.com
org:
  name: MILL5
  legal_name: MILL5, LLC
  url: https://mill5.com
  description: MILL5 is a Boston-based Microsoft Gold Partner specializing in cloud, AI, IoT, data analytics, and modern application development.
podcast:
  name: Inventing Fire with AI
  url: https://inventingfirewith.ai
social:
  name: MILL5
  links:
    - https://github.com/MILL5
    - https://mill5.com
github_repo: https://github.com/MILL5/yocto
nuget_url: https://www.nuget.org/packages/yocto
version: 3.0.0

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630
        alt: yocto 3 — the tiny IoC container for .NET 10, by MILL5

nav:
  - title: Getting started
    url: /getting-started/
  - title: Guides
    url: /guides/
  - title: FAQ
    url: /faq/
  - title: Changelog
    url: /changelog/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
